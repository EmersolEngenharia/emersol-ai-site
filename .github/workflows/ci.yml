name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:seo
      - name: Install PHP and test the contact endpoint
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
          npm run test:contact
